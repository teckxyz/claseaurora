  <style>
    .controls {
      padding: 0 2rem 2rem;
      max-width: 700px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 1rem;
      align-items: center;
    }
    .search-wrap {
      position: relative;
      width: 100%;
    }
    .search-wrap svg {
      position: absolute;
      left: 0.9rem;
      top: 50%;
      transform: translateY(-50%);
      color: var(--muted);
      pointer-events: none;
    }
    #search-input {
      width: 100%;
      padding: 0.7rem 1rem 0.7rem 2.5rem;
      background: var(--bg3);
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--text);
      font-family: var(--font);
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s;
    }
    #search-input:focus { border-color: var(--teal); }
    #search-input::placeholder { color: var(--muted); }
    .filter-btns {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
      justify-content: center;
    }
    .filter-btn {
      padding: 0.35rem 1rem;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: var(--bg3);
      color: var(--muted);
      font-family: var(--font);
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }
    .filter-btn:hover { border-color: var(--border-h); color: var(--text); }
    .filter-btn.active { background: var(--card-h); border-color: var(--border-h); color: var(--text); }
    .filter-btn[data-group="Roble"].active   { border-color: #4ade80; color: #4ade80; background: rgba(74,222,128,0.08); }
    .filter-btn[data-group="Violeta"].active { border-color: #a78bfa; color: #a78bfa; background: rgba(167,139,250,0.08); }
    .filter-btn[data-group="Cupey"].active   { border-color: #60a5fa; color: #60a5fa; background: rgba(96,165,250,0.08); }

    .students-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 1.1rem;
      padding: 0 2rem 4rem;
    }
    .student-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--r);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: border-color 0.2s, transform 0.2s, box-shadow 0.2s;
    }
    .student-card:hover {
      border-color: var(--border-h);
      transform: translateY(-3px);
      box-shadow: 0 14px 32px rgba(0,0,0,0.45);
    }
    .card-photo {
      width: 100%;
      aspect-ratio: 3 / 4;
      object-fit: cover;
      object-position: top;
      background: var(--bg3);
      display: block;
    }
    .card-body {
      padding: 0.85rem 0.9rem 0.5rem;
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
      flex: 1;
    }
    .card-name {
      font-size: 0.95rem;
      font-weight: 700;
      line-height: 1.3;
    }
    .card-footer {
      padding: 0.5rem 0.9rem 0.75rem;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      min-height: 2.2rem;
    }
    .card-player {
      width: 100%;
      border: none;
      border-top: 1px solid var(--border);
      background: transparent;
      display: block;
    }
    .insta-link {
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
      font-size: 0.78rem;
      color: var(--muted);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 0.25rem 0.55rem;
      transition: color 0.2s, border-color 0.2s;
    }
    .insta-link:hover { color: #e1306c; border-color: #e1306c; }
    .insta-link svg { width: 13px; height: 13px; flex-shrink: 0; }
    .no-results {
      display: none;
      text-align: center;
      color: var(--muted);
      padding: 3rem 2rem;
      grid-column: 1 / -1;
    }
    @media (max-width: 600px) {
      .students-grid { grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 0.75rem; padding: 0 1rem 3rem; }
      .controls { padding: 0 1rem 1.5rem; }
    }
  </style>
</head>

      card.dataset.group = s.group;

      const instaHTML = s.insta
        ? `<a class="insta-link" href="${s.insta}" target="_blank" rel="noreferrer">${INSTA} Instagram</a>`
        : '';
      const playerHTML = s.player
        ? `<iframe class="card-player" src="${s.player}" height="80" title="Canción de ${s.name}" loading="lazy"></iframe>`
        : '';

      card.innerHTML = `
        <img class="card-photo" src="${s.photo}" alt="${s.name}" loading="lazy">
        <div class="card-body">
          <div class="card-name">${s.name}</div>
          <span class="badge ${BADGE[s.group] || 'badge-todos'}">${s.group}</span>
        </div>
        ${playerHTML}
        <div class="card-footer">${instaHTML}</div>
      `;
      grid.appendChild(card);
    });

    // Search & filter
    const searchInput = document.getElementById('search-input');
    const filterBtns  = document.querySelectorAll('.filter-btn');
    let activeGroup = 'all';

    function applyFilters() {
      const raw = searchInput.value.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
      const cards = grid.querySelectorAll('.student-card');
      let visible = 0;
      cards.forEach(card => {
        const match = card.dataset.name.includes(raw)
          && (activeGroup === 'all' || card.dataset.group === activeGroup);
        card.style.display = match ? '' : 'none';
        if (match) visible++;
      });
      noResults.style.display = visible === 0 ? 'block' : 'none';
    }

    searchInput.addEventListener('input', applyFilters);
    filterBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        filterBtns.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        activeGroup = btn.dataset.group;
        applyFilters();
      });
    });
  </script>
</body>
</html>
