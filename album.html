  <style>
    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 6px;
      padding: 0 1.5rem 4rem;
    }

    .gallery a {
      display: block;
      overflow: hidden;
      border-radius: 8px;
      aspect-ratio: 4 / 3;
      background: var(--bg3);
      border: 1px solid var(--border);
    }

    .gallery img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.35s ease, opacity 0.4s;
      opacity: 0;
    }

    .gallery img.loaded { opacity: 1; }

    .gallery a:hover img { transform: scale(1.06); }

    /* Skeleton shimmer while image hasn't loaded yet */
    .gallery a::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(90deg, var(--bg3) 25%, var(--bg2) 50%, var(--bg3) 75%);
      background-size: 200% 100%;
      animation: shimmer 1.4s infinite;
      border-radius: 8px;
    }

    .gallery a { position: relative; }
    .gallery img.loaded ~ * { display: none; }
    .gallery a:has(img.loaded)::before { display: none; }

    @keyframes shimmer {
      0%   { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }

    @media (max-width: 600px) {
      .gallery {
        grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
        gap: 4px;
        padding: 0 0.75rem 3rem;
      }
    }
  </style>

    const gallery = document.getElementById('gallery');

    // Only assign img.src when the image is ~400px from entering the viewport.
    // This way the browser never requests all 263 images at once.
    const observer = new IntersectionObserver((entries, obs) => {
      entries.forEach(entry => {
        if (!entry.isIntersecting) return;
        const img = entry.target;
        img.src = img.dataset.src;
        img.onload  = () => img.classList.add('loaded');
        img.onerror = () => img.classList.add('loaded'); // hide broken shimmer too
        obs.unobserve(img);
      });
    }, { rootMargin: '400px 0px' });

    images.forEach(url => {
      const a = document.createElement('a');
      a.href = url;
      a.setAttribute('data-fancybox', 'gallery');

      const img = document.createElement('img');
      img.dataset.src = url;   // store URL — don't set src yet
      img.alt = 'Clase Aurora 2024';

      observer.observe(img);
      a.appendChild(img);
      gallery.appendChild(a);
    });

    Fancybox.bind('[data-fancybox="gallery"]', {
      Toolbar: { display: { left: [], middle: [], right: ['close'] } },
      Images: { zoom: false },
    });
