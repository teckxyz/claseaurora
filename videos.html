<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vídeos — Clase Aurora 2024</title>
  <link rel="icon" type="image/x-icon" href="https://i.postimg.cc/sXnmQqcX/favicon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Signika:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="theme.css" />
  <style>
    .videos-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(min(100%, 560px), 1fr));
      gap: 2rem;
      max-width: 1200px;
      margin: 0 auto;
      padding: 2rem;
    }

    .video-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--r);
      overflow: hidden;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .video-card:hover {
      border-color: var(--border-h);
      box-shadow: 0 4px 24px rgba(0, 0, 0, 0.4);
    }

    .video-wrapper {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      background: var(--bg2);
    }

    .video-wrapper iframe {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: none;
    }

    .video-info {
      padding: 1rem 1.25rem;
    }

    .video-info h2 {
      font-size: 1rem;
      font-weight: 600;
      color: var(--text);
    }
  </style>
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar">
    <a class="navbar-brand" href="index.html">
      <img src="assets/logo.jpg" alt="Clase Aurora" />
      <span class="aurora-text">Clase Aurora 2024</span>
    </a>
    <button class="navbar-toggle" id="navToggle" aria-label="Menú">
      <svg width="20" height="20" viewBox="0 0 20 20" fill="currentColor">
        <rect y="3" width="20" height="2" rx="1"/>
        <rect y="9" width="20" height="2" rx="1"/>
        <rect y="15" width="20" height="2" rx="1"/>
      </svg>
    </button>
    <div class="navbar-links" id="navLinks">
      <a href="index.html">Inicio</a>
      <a href="album.html">Álbum</a>
      <a href="yearbook/yearbook.html">Yearbook</a>
      <a href="videos.html" class="active">Vídeos</a>
      <a href="cons.html">Ring Ceremony</a>
    </div>
  </nav>

  <!-- Page header -->
  <header class="page-header">
    <h1><span class="aurora-text">Vídeos</span></h1>
    <p>Momentos especiales de Clase Aurora 2024</p>
    <div class="aurora-bar" style="width:60px;margin:0.75rem auto 0;"></div>
  </header>

  <!-- Videos grid -->
  <main class="videos-grid">

    <div class="video-card">
      <div class="video-wrapper">
        <iframe
          src="https://www.youtube.com/embed/oM805smua3Q?si=0shKzXzcJwIv58cb"
          title="Recap - Entrada Senior"
          allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
          allowfullscreen
          loading="lazy">
        </iframe>
      </div>
      <div class="video-info">
        <h2>Recap — Entrada Senior</h2>
      </div>
    </div>

    <div class="video-card">
      <div class="video-wrapper">
        <iframe
          src="https://www.youtube.com/embed/lCMvortVDlM?si=x411u2LzgbUrvBkp"
          title="Mensaje del Pasado"
          allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
          allowfullscreen
          loading="lazy">
        </iframe>
      </div>
      <div class="video-info">
        <h2>Mensaje del Pasado</h2>
      </div>
    </div>

    <div class="video-card">
      <div class="video-wrapper">
        <iframe
          src="https://www.youtube.com/embed/Bs6JHsZeMr0?si=BPSx08wybPUEvQyC"
          title="Recap - Entrada Senior II"
          allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
          allowfullscreen
          loading="lazy">
        </iframe>
      </div>
      <div class="video-info">
        <h2>Recap — Entrada Senior II</h2>
      </div>
    </div>

  </main>

  <!-- Footer -->

    <div class="aurora-bar" style="width:40px;"></div>
    <span>© 2024 Clase Aurora 2024</span>
